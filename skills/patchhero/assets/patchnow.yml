# patchhero: scheduled vulnerability scan with priority
#
# Copy this file to .github/workflows/patchhero.yml in your repository.
#
# Every six hours (and on every push to the default branch) it scans the
# repository's lockfiles, Dockerfiles and runtime version files against
# OSV.dev, NVD, endoflife.date, CISA KEV and FIRST EPSS, then:
#   - writes the report to the job summary,
#   - opens or updates an issue labelled "patchhero" when P0/P1 findings exist,
#   - fails the job on P0 (patch today) so the repository shows red.
#
# Nothing in the repository is modified. No secrets are needed beyond the
# default GITHUB_TOKEN. Only package names and versions are sent to OSV.dev.
#
# Two things to know:
#   - GitHub pauses scheduled workflows in a public repository after 60 days
#     without commits. It emails you; one click on the Actions tab re-enables
#     it, and pushes still trigger the scan. Private repositories are unaffected.
#   - If this runner cannot reach github.com/Mojizhasan/patchhero (private fork,
#     air-gapped runner), vendor the scanner instead: copy scan.mjs into
#     .github/patchhero/scan.mjs, delete the "Fetch patchhero" step, and change
#     the two "node .patchhero/..." paths to "node .github/patchhero/scan.mjs".

name: patchhero

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Scan for vulnerabilities getting traction
    runs-on: ubuntu-latest
    outputs:
      urgent: ${{ steps.scan.outputs.urgent }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch patchhero
        uses: actions/checkout@v4
        with:
          repository: Mojizhasan/patchhero
          path: .patchhero

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan
        id: scan
        run: |
          set +e
          node .patchhero/skills/patchhero/scripts/scan.mjs . --md --no-color --fail-on P1 > patchhero-report.md
          code=$?
          set -e
          cat patchhero-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then echo "urgent=true" >> "$GITHUB_OUTPUT"; else echo "urgent=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = "1" ]; then echo "::error::patchhero scan failed"; exit 1; fi

      - name: Open or update the patchhero issue
        if: steps.scan.outputs.urgent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="patchhero: vulnerabilities to patch now"
          gh label create patchhero --color B60205 --description "Opened by patchhero" 2>/dev/null || true
          existing=$(gh issue list --label patchhero --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file patchhero-report.md
            gh issue comment "$existing" --body "Report updated $(date -u +%Y-%m-%dT%H:%MZ) by patchhero."
          else
            gh issue create --title "$title" --label patchhero --body-file patchhero-report.md
          fi

      - name: Fail on P0 (patch today)
        run: node .patchhero/skills/patchhero/scripts/scan.mjs . --quiet --no-color --offline --fail-on P0 > /dev/null

  # Optional: let Claude Code apply the patches and open a pull request.
  # Needs an ANTHROPIC_API_KEY repository secret and the patchhero plugin.
  # Check https://github.com/anthropics/claude-code-action for the current
  # input names before enabling, then remove the leading "# " on each line.
  #
  # autofix:
  #   name: Open a fix PR with Claude Code
  #   needs: scan
  #   if: needs.scan.outputs.urgent == 'true'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: write
  #     pull-requests: write
  #     issues: read
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: anthropics/claude-code-action@v1
  #       with:
  #         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  #         plugin_marketplaces: https://github.com/Mojizhasan/patchhero
  #         plugins: patchhero@patchhero
  #         prompt: |
  #           Use the patchhero skill. Patch every P0 and P1 finding in this repository,
  #           run the project's tests, and open a pull request titled
  #           "patchhero: security patches" whose body is the markdown report.
  #           Leave runtime findings that need a server change as a checklist in the PR.
