  #           Use the patchnow skill. Patch every P0 and P1 finding in this repository,
  #           run the project's tests, and open a pull request titled
  #           "patchnow: security patches" whose body is the markdown report.
  #           Leave runtime findings that need a server change as a checklist in the PR.
