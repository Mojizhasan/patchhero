name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Live scan of the example projects
        run: node skills/patchnow/scripts/scan.mjs examples/php-app examples/node-app examples/python-app --no-color
