<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a1a"/>
      <stop offset="0.6" stop-color="#121a3f"/>
      <stop offset="1" stop-color="#2a1550"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff7b72" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7b72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#b3122b"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6cff"/>
      <stop offset="1" stop-color="#132a7a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a300"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>

    <!-- speed lines radiating from the hero -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
      <line x1="430" y1="210" x2="-100" y2="-60"/><line x1="430" y1="210" x2="-100" y2="60"/><line x1="430" y1="210" x2="-100" y2="210"/>
      <line x1="430" y1="210" x2="-100" y2="360"/><line x1="430" y1="210" x2="-100" y2="480"/><line x1="430" y1="210" x2="200" y2="-80"/>
      <line x1="430" y1="210" x2="200" y2="500"/><line x1="430" y1="210" x2="1300" y2="-80"/><line x1="430" y1="210" x2="1300" y2="60"/>
      <line x1="430" y1="210" x2="1300" y2="200"/><line x1="430" y1="210" x2="1300" y2="340"/><line x1="430" y1="210" x2="1300" y2="500"/>
      <line x1="430" y1="210" x2="600" y2="-80"/><line x1="430" y1="210" x2="650" y2="500"/>
    </g>

    <!-- skyline -->
    <g fill="#05070f" opacity="0.9">
      <rect x="0" y="330" width="1200" height="90"/>
      <rect x="40" y="290" width="38" height="60"/><rect x="95" y="265" width="26" height="80"/><rect x="140" y="300" width="50" height="50"/>
      <rect x="220" y="280" width="30" height="70"/><rect x="270" y="310" width="60" height="40"/><rect x="560" y="300" width="34" height="50"/>
      <rect x="620" y="275" width="22" height="75"/><rect x="660" y="295" width="48" height="55"/><rect x="740" y="282" width="30" height="68"/>
      <rect x="800" y="305" width="70" height="45"/><rect x="900" y="270" width="28" height="80"/><rect x="950" y="296" width="52" height="54"/>
      <rect x="1030" y="284" width="34" height="66"/><rect x="1090" y="302" width="60" height="48"/><rect x="1165" y="278" width="20" height="72"/>
    </g>
    <g fill="#ffd166" opacity="0.35">
      <rect x="48" y="300" width="4" height="4"/><rect x="60" y="312" width="4" height="4"/><rect x="100" y="275" width="4" height="4"/><rect x="108" y="290" width="4" height="4"/>
      <rect x="628" y="285" width="4" height="4"/><rect x="668" y="305" width="4" height="4"/><rect x="908" y="280" width="4" height="4"/><rect x="960" y="306" width="4" height="4"/>
      <rect x="1040" y="294" width="4" height="4"/><rect x="1100" y="312" width="4" height="4"/><rect x="1170" y="288" width="4" height="4"/>
    </g>

    <!-- beaten villains: cracked, struck-through name plates fading into the distance -->
    <g font-weight="800" font-size="22" opacity="0.55">
      <g transform="translate(700 70) rotate(-8)">
        <rect x="-78" y="-18" width="156" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">Heartbleed</text>
        <path d="M-78 -4 L-50 2 L-40 -14" stroke="#ffd166" stroke-width="2" fill="none"/>
        <line x1="-72" y1="0" x2="72" y2="2" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(880 55) rotate(6)">
        <rect x="-78" y="-18" width="156" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">Shellshock</text>
        <path d="M60 -18 L48 -2 L62 10" stroke="#ffd166" stroke-width="2" fill="none"/>
        <line x1="-72" y1="2" x2="72" y2="-2" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(1060 100) rotate(-5)">
        <rect x="-78" y="-18" width="156" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">WannaCry</text>
        <line x1="-72" y1="-2" x2="72" y2="3" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(760 150) rotate(4)">
        <rect x="-84" y="-18" width="168" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">Log4Shell</text>
        <path d="M-30 -18 L-22 -4 L-36 8 L-26 18" stroke="#ffd166" stroke-width="2" fill="none"/>
        <line x1="-78" y1="3" x2="78" y2="-2" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(960 190) rotate(-7)">
        <rect x="-90" y="-18" width="180" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">xz backdoor</text>
        <line x1="-84" y1="-1" x2="84" y2="3" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(1110 250) rotate(5)">
        <rect x="-96" y="-18" width="192" height="36" rx="6" fill="#3a0f1d" stroke="#ff7b72" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" fill="#ffb3ad">Fridge hack '26</text>
        <path d="M40 -18 L30 -6 L44 4 L34 18" stroke="#ffd166" stroke-width="2" fill="none"/>
        <line x1="-90" y1="2" x2="90" y2="-3" stroke="#ff5a5f" stroke-width="3"/>
      </g>
      <g transform="translate(820 250) rotate(-3)" opacity="1">
        <rect x="-84" y="-20" width="168" height="40" rx="6" fill="#4a1020" stroke="#ff7b72" stroke-width="2.5"/>
        <text x="0" y="9" text-anchor="middle" fill="#ffc7c2" font-size="24">PHP2Shell</text>
        <path d="M-84 -6 L-62 0 L-70 -20" stroke="#ffd166" stroke-width="2.5" fill="none"/>
        <path d="M84 6 L66 0 L74 20" stroke="#ffd166" stroke-width="2.5" fill="none"/>
        <line x1="-78" y1="-3" x2="78" y2="4" stroke="#ff5a5f" stroke-width="3.5"/>
      </g>
    </g>

    <!-- hero glow -->
    <ellipse cx="430" cy="215" rx="260" ry="190" fill="url(#glow)"/>

    <!-- the hero, flying toward the viewer -->
    <g filter="url(#shadow)">
      <!-- cape -->
      <path d="M430 150 C 560 60, 760 90, 720 210 C 690 300, 560 330, 470 300 C 380 330, 260 300, 230 210 C 190 90, 300 60, 430 150 Z" fill="url(#cape)" opacity="0.95"/>
      <path d="M430 160 C 540 110, 650 130, 660 200 C 640 270, 540 290, 460 270 C 380 290, 260 270, 240 200 C 250 130, 320 110, 430 160 Z" fill="#8e0f24" opacity="0.5" filter="url(#soft)"/>
      <!-- torso -->
      <path d="M350 180 C 350 130, 510 130, 510 180 L 520 270 C 520 310, 340 310, 340 270 Z" fill="url(#suit)"/>
      <!-- shoulders -->
      <ellipse cx="340" cy="190" rx="34" ry="26" fill="#2d6cff"/><ellipse cx="520" cy="190" rx="34" ry="26" fill="#2d6cff"/>
      <!-- fists punching toward the viewer (foreshortened: big and close) -->
      <path d="M335 190 L 300 275" stroke="#2d6cff" stroke-width="44" stroke-linecap="round"/>
      <path d="M525 190 L 560 275" stroke="#2d6cff" stroke-width="44" stroke-linecap="round"/>
      <circle cx="290" cy="300" r="42" fill="#ffd9b3"/><circle cx="290" cy="300" r="42" fill="none" stroke="#132a7a" stroke-width="6"/>
      <path d="M262 290 Q 290 275 318 290" stroke="#c98c5a" stroke-width="3" fill="none"/>
      <circle cx="570" cy="300" r="42" fill="#ffd9b3"/><circle cx="570" cy="300" r="42" fill="none" stroke="#132a7a" stroke-width="6"/>
      <path d="M542 290 Q 570 275 598 290" stroke="#c98c5a" stroke-width="3" fill="none"/>
      <!-- chest emblem: a shield with a patch -->
      <path d="M430 175 L 475 190 L 468 245 C 462 270, 440 285, 430 290 C 420 285, 398 270, 392 245 L 385 190 Z" fill="url(#gold)" stroke="#8a5a00" stroke-width="3"/>
      <g transform="translate(430 232) rotate(-35)">
        <rect x="-26" y="-11" width="52" height="22" rx="9" fill="#ff5a5f" stroke="#8a1a1a" stroke-width="2.5"/>
        <rect x="-10" y="-7" width="20" height="14" rx="3" fill="#ffd9b3" opacity="0.9"/>
      </g>
      <!-- head -->
      <circle cx="430" cy="118" r="40" fill="#ffd9b3"/>
      <path d="M392 108 C 400 70, 460 70, 468 108 C 455 98, 405 98, 392 108 Z" fill="#1b1230"/>
      <rect x="396" y="108" width="68" height="24" rx="12" fill="#132a7a"/>
      <ellipse cx="416" cy="120" rx="9" ry="5" fill="#ffffff"/><ellipse cx="444" cy="120" rx="9" ry="5" fill="#ffffff"/>
      <path d="M416 142 Q 430 150 444 142" stroke="#8a4a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- title -->
    <text x="640" y="320" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">patchhero</text>
    <text x="643" y="356" font-size="20" font-weight="600" fill="#ffd166">When a vulnerability gets traction, patch now.</text>
    <text x="643" y="384" font-size="15" fill="#aab4d6">Claude Code plugin · zero dependencies · OSV · NVD · CISA KEV · EPSS · the news</text>
  </g>
</svg>
